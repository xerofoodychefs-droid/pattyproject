# ==============================================================================
# Patty Project UK — Production Docker Compose Configuration
# Architecture: Host Nginx -> Private Bridge Network (patty_network) -> PostgreSQL 16
# ==============================================================================

version: '3.8'

networks:
  patty_network:
    name: patty_network
    driver: bridge
    internal: false  # Allows egress for external payment webhooks / GIS OAuth when FastAPI is attached

volumes:
  patty_postgres_data:
    name: patty_postgres_data

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Production Database Service (NO HOST PORT BINDING)
  # ----------------------------------------------------------------------------
  patty_postgres:
    image: postgres:16-alpine
    container_name: patty_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - patty_network
    # CRITICAL SECURITY RULE: Zero host ports exposed.
    # ports: section is intentionally omitted to prevent public or host access.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patty_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-patty_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - patty_postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres_app_user.sh:/docker-entrypoint-initdb.d/init_postgres_app_user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-patty_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2560M
        reservations:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  patty_backend:
    image: python:3.11-slim
    container_name: patty_backend
    restart: unless-stopped
    working_dir: /app
    security_opt:
      - no-new-privileges:true
    networks:
      - patty_network
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB:-patty_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-patty_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-square}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-production}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_EMAIL_FROM: ${CONTACT_EMAIL_FROM:-Patty Project <website@pattyproject.co.uk>}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-xerofoodychefs@gmail.com}
    volumes:
      - ./backend:/app
    depends_on:
      patty_postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt psycopg2-binary
      && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
